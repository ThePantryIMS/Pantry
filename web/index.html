<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Pantry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    color-scheme:light;
    --paper:#F6F4EE; --raised:#FFFFFF; --ink:#23241F; --soft:#5C5B52;
    --rail:#2E3D34; --rail2:#3E5245;
    --amber:#C97C1D; --amber-bg:#FBEFDC; --sage:#5C7F5F; --sage-bg:#E6EEE3;
    --rust:#B34632; --rust-bg:#F7E4DE; --slate:#4A5C6B; --slate-bg:#E6ECEF;
    --violet:#6B5B95; --violet-bg:#EAE5F2; --line:#DDD8CC; --r:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  .display{font-family:'Archivo Black',Impact,sans-serif;}
  .rail{background:var(--rail);color:#EFEDE4;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .rail h1{font-family:'Archivo Black',Impact,sans-serif;font-size:19px;letter-spacing:.06em;text-transform:uppercase;margin:0;}
  .who{font-size:12px;color:#C7D0C6;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .tabs{display:flex;gap:4px;background:var(--rail2);padding:6px 24px 0;overflow-x:auto;}
  .tab{padding:10px 16px;font-size:13px;font-weight:600;color:#C7D0C6;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap;user-select:none;}
  .tab:hover{color:#fff;} .tab.active{background:var(--paper);color:var(--ink);}
  main{max-width:1100px;margin:0 auto;padding:22px 18px 90px;}
  input,select,button,textarea{font-family:inherit;font-size:14px;}
  input,select,textarea{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--ink);min-width:0;}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--rail2);outline-offset:2px;}
  .btn{padding:10px 16px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-weight:600;background:var(--rail);color:#fff;}
  .btn:hover{background:var(--rail2);} .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--soft);} .btn.ghost:hover{border-color:var(--soft);}
  .btn.danger{background:transparent;border-color:var(--rust);color:var(--rust);} .btn.danger:hover{background:var(--rust-bg);}
  .btn.prep{background:var(--violet);} .btn.prep:hover{background:#5A4B83;}
  .btn.sm{padding:6px 10px;font-size:12px;border-radius:6px;}
  .card{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px;overflow-x:auto;}
  .card h2{margin:0 0 4px;font-size:15px;} .card .sub{font-size:12px;color:var(--soft);margin:0 0 12px;}
  .note{font-size:13px;color:var(--soft);background:var(--slate-bg);border-radius:8px;padding:10px 12px;line-height:1.5;margin-bottom:14px;}
  .note.warn{background:var(--amber-bg);color:#6B4408;} .note.bad{background:var(--rust-bg);color:#7A2E1F;} .note.ok{background:var(--sage-bg);color:#345236;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px;}
  .tile{background:var(--raised);border:1px solid var(--line);border-left:4px solid var(--sage);border-radius:var(--r);padding:14px 16px;}
  .tile.warn{border-left-color:var(--amber);} .tile.bad{border-left-color:var(--rust);}
  .tile .n{font-size:28px;font-weight:700;} .tile .l{font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  td input,td select{width:100%;padding:6px 8px;}
  .tn{font-variant-numeric:tabular-nums;text-align:right;} th.tn{text-align:right;}
  .pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .pill.ok{background:var(--sage-bg);color:#3E5C41;} .pill.low{background:var(--amber-bg);color:#8A5710;} .pill.neg{background:var(--rust-bg);color:#8A3A28;} .pill.off{background:var(--slate-bg);color:var(--slate);}
  .pill.prep{background:var(--violet-bg);color:var(--violet);}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .toolbar .grow{flex:1;min-width:160px;}
  .row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px;}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0;} .field label{font-size:12px;font-weight:600;color:var(--soft);}
  .center{max-width:420px;margin:60px auto;padding:0 16px;}
  .cat{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--soft);margin:18px 0 6px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--rail);color:#fff;padding:12px 18px;border-radius:10px;z-index:90;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px;}
  .toast.err{background:var(--rust);}
  .modal-bg{position:fixed;inset:0;background:rgba(35,36,31,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  .modal{background:var(--raised);border-radius:14px;padding:22px;width:100%;max-width:480px;}
  .modal h3{margin:0 0 14px;font-family:'Archivo Black',Impact,sans-serif;font-size:15px;text-transform:uppercase;font-weight:400;}
  .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
  .hidden{display:none !important;}
  .muted{color:var(--soft);}
  @media (max-width:640px){ .rail{padding:14px 16px;} .tabs{padding-inline:16px;} main{padding-inline:12px;} .card{padding:14px;} }

  /* ---- built-in assistant (managers only) ---- */
  .bot-fab{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;border:none;background:var(--rail);color:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:45;}
  .bot-fab:hover{background:var(--rail2);}
  .bot-panel{position:fixed;right:18px;bottom:84px;width:400px;max-width:calc(100% - 36px);height:min(600px,calc(100vh - 110px));background:var(--raised);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.22);display:flex;flex-direction:column;z-index:45;overflow:hidden;}
  .bot-head{background:var(--rail);color:#EFEDE4;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .bot-head b{font-family:'Archivo Black',Impact,sans-serif;font-weight:400;font-size:13px;letter-spacing:.06em;text-transform:uppercase;}
  .bot-head button{background:transparent;border:none;color:#EFEDE4;font-size:20px;line-height:1;cursor:pointer;padding:2px 6px;}
  .bot-log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--paper);}
  .bot-msg{flex-shrink:0;max-width:100%;font-size:13px;line-height:1.45;border-radius:10px;padding:9px 11px;overflow-x:auto;}
  .bot-msg.me{align-self:flex-end;max-width:85%;background:var(--rail);color:#fff;}
  .bot-msg.it{align-self:stretch;background:var(--raised);border:1px solid var(--line);}
  .bot-msg p{margin:0 0 6px;} .bot-msg p:last-child{margin-bottom:0;}
  .bot-msg table{font-size:12px;margin:6px 0;} .bot-msg th{font-size:10px;padding:4px 6px;} .bot-msg td{padding:5px 6px;}
  .bot-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .bot-chip{border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;}
  .bot-chip:hover{border-color:var(--soft);}
  .bot-quick{padding:8px 12px 0;border-top:1px solid var(--line);background:var(--raised);}
  .bot-quick .bot-chips{flex-wrap:nowrap;overflow-x:auto;margin-top:0;padding-bottom:4px;}
  .bot-quick .bot-chip{white-space:nowrap;flex-shrink:0;}
  .bot-in{display:flex;gap:8px;padding:10px 12px 12px;background:var(--raised);}
  .bot-in input{flex:1;}
  .bot-card{border:1px solid var(--line);border-left:4px solid var(--violet);border-radius:8px;padding:10px;margin:8px 0;background:var(--raised);}
  .bot-card .field{margin-top:6px;} .bot-card select,.bot-card input{width:100%;padding:6px 8px;font-size:13px;}
  .bot-why{font-size:12px;color:var(--soft);margin-top:6px;}
  .bot-why.check{color:#8A5710;}
  @media (max-width:640px){ .bot-panel{right:8px;left:8px;width:auto;max-width:none;bottom:80px;height:calc(100vh - 100px);} .bot-fab{right:12px;bottom:12px;} }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden" role="status"></div>
<div id="modal" class="modal-bg hidden"><div class="modal" id="modalBody"></div></div>

<script>
(function(){
'use strict';

/* ------------------------------------------------------------------ config */
const DEFAULT_URL = 'https://cowkeaumgsvkecyxljwq.supabase.co';
const BUILT_IN_KEY = '';           // optional: paste the anon key here to skip the setup screen
const LS_URL = 'pantry_supabase_url', LS_KEY = 'pantry_supabase_anon_key';

/* ------------------------------------------------------------------ helpers */
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/[$,\s]/g, '')); return isNaN(n) ? null : n; };
const fmt = n => n == null ? '—' : (Math.round(Number(n) * 100) / 100).toLocaleString();
const money = n => n == null ? '—' : '$' + (Math.round(Number(n) * 100) / 100).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
const when = ts => { const d = new Date(ts); return d.toLocaleDateString([], {month:'short', day:'numeric'}) + ' ' + d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); };
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()); };
const LEVEL = {staff:1, manager:2, admin:3};

let sb = null, me = null, items = [], itemById = {}, sauces = [], menuRecipes = [], skuRows = [];
let currentTab = 'dashboard';

function toast(msg, isErr){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (isErr ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), isErr ? 7000 : 3500);
}
function showModal(html){ $('#modalBody').innerHTML = html; $('#modal').classList.remove('hidden'); }
function hideModal(){ $('#modal').classList.add('hidden'); $('#modalBody').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') hideModal(); });

async function q(promise){ const r = await promise; if (r.error) throw r.error; return r.data; }
function errText(e){ return (e && (e.message || e.details)) || String(e); }
function has(role){ return me && me.is_active && (LEVEL[me.role] || 0) >= LEVEL[role]; }

/* ------------------------------------------------------------------ boot */
function boot(){
  const url = localStorage.getItem(LS_URL) || DEFAULT_URL;
  const key = BUILT_IN_KEY || localStorage.getItem(LS_KEY) || '';
  if (!key) return renderSetup(url);
  try { sb = window.supabase.createClient(url, key); }
  catch (e) { return renderSetup(url, 'Could not start: ' + errText(e)); }
  sb.auth.onAuthStateChange((evt, session) => { if (evt === 'SIGNED_OUT') { me = null; renderLogin(); } });
  sb.auth.getSession().then(({data}) => data.session ? afterLogin() : renderLogin());
}

function renderSetup(url, msg){
  $('#app').innerHTML =
    '<div class="center"><div class="card"><h2 class="display">The Pantry</h2>' +
    '<p class="sub">First-time setup. Paste your Supabase project details. They are saved in this browser only.</p>' +
    (msg ? '<div class="note bad">' + esc(msg) + '</div>' : '') +
    '<div class="field" style="margin-bottom:10px"><label>Project URL</label><input id="setUrl" value="' + esc(url) + '" placeholder="https://xxxx.supabase.co"></div>' +
    '<div class="field" style="margin-bottom:10px"><label>Anon / publishable key</label><input id="setKey" placeholder="eyJ... or sb_publishable_..."></div>' +
    '<div class="note warn">Use the <b>anon / publishable</b> key from Project Settings &rarr; API. Never use the service_role or secret key.</div>' +
    '<button class="btn" id="setSave">Save and continue</button></div></div>';
  $('#setSave').onclick = () => {
    const u = $('#setUrl').value.trim().replace(/\/+$/, ''), k = $('#setKey').value.trim();
    if (!/^https:\/\/.+/.test(u) || !k) return toast('Enter both the URL and the key.', true);
    localStorage.setItem(LS_URL, u); localStorage.setItem(LS_KEY, k); boot();
  };
}

function renderLogin(){
  unmountBot();
  let signup = false;
  const draw = () => {
    $('#app').innerHTML =
      '<div class="center"><div class="card"><h2 class="display">The Pantry</h2>' +
      '<p class="sub">' + (signup ? 'Create an account. A manager or admin must activate it before you can see anything.' : 'Sign in to continue.') + '</p>' +
      '<div class="field" style="margin-bottom:10px"><label>Email</label><input id="lEmail" type="email" autocomplete="username"></div>' +
      '<div class="field" style="margin-bottom:14px"><label>Password</label><input id="lPass" type="password" autocomplete="' + (signup ? 'new-password' : 'current-password') + '"></div>' +
      '<div class="toolbar"><button class="btn" id="lGo">' + (signup ? 'Create account' : 'Sign in') + '</button>' +
      '<button class="btn ghost" id="lSwap">' + (signup ? 'I have an account' : 'Create account') + '</button></div>' +
      '<p class="sub"><a href="#" id="lReset">Change Supabase URL / key</a></p></div></div>';
    $('#lSwap').onclick = () => { signup = !signup; draw(); };
    $('#lReset').onclick = e => { e.preventDefault(); localStorage.removeItem(LS_KEY); boot(); };
    $('#lPass').addEventListener('keydown', e => { if (e.key === 'Enter') $('#lGo').click(); });
    $('#lGo').onclick = async () => {
      const email = $('#lEmail').value.trim(), password = $('#lPass').value;
      if (!email || !password) return toast('Enter email and password.', true);
      $('#lGo').disabled = true;
      try {
        if (signup) {
          const {data, error} = await sb.auth.signUp({email, password});
          if (error) throw error;
          if (data.session) return afterLogin();
          toast('Account created. Check your email to confirm it, then sign in.');
          signup = false; draw();
        } else {
          const {error} = await sb.auth.signInWithPassword({email, password});
          if (error) throw error;
          afterLogin();
        }
      } catch (e) { toast(errText(e), true); $('#lGo').disabled = false; }
    };
  };
  draw();
}

async function afterLogin(){
  try {
    const {data:{user}} = await sb.auth.getUser();
    const rows = await q(sb.from('user_account').select('*').eq('user_id', user.id));
    me = rows[0] || null;
  } catch (e) { toast(errText(e), true); me = null; }
  if (!me || !me.is_active) return renderWaiting();
  await loadRefs();
  renderShell();
}

function renderWaiting(){
  unmountBot();
  $('#app').innerHTML =
    '<div class="center"><div class="card"><h2 class="display">Almost there</h2>' +
    '<div class="note warn">Your account exists but has not been activated yet. Ask an admin to switch it on, then refresh this page.</div>' +
    '<div class="toolbar"><button class="btn" id="wRefresh">Refresh</button><button class="btn ghost" id="wOut">Sign out</button></div></div></div>';
  $('#wRefresh').onclick = afterLogin;
  $('#wOut').onclick = () => sb.auth.signOut();
}

async function loadRefs(){
  items = await q(sb.from('inventory_item').select('*').order('item_name'));
  itemById = {}; items.forEach(i => itemById[i.item_id] = i);
  const rec = await q(sb.from('recipe').select('recipe_id,recipe_name,recipe_type,toast_menu_item,yield_quantity,is_active').order('recipe_name'));
  sauces = rec.filter(r => r.recipe_type === 'sauce' && r.is_active);
  menuRecipes = rec.filter(r => r.recipe_type === 'menu' && r.is_active);
}

/* ------------------------------------------------------------------ shell + router */
const TABS = [
  {id:'dashboard', label:'Dashboard', min:'staff', fn: viewDashboard},
  {id:'inventory', label:'Inventory', min:'staff', fn: viewInventory},
  {id:'log',       label:'Log waste / prep / count', min:'staff', fn: viewLog},
  {id:'import',    label:'Import', min:'manager', fn: viewImport},
  {id:'skus',      label:'US Foods SKUs', min:'manager', fn: viewSkus},
  {id:'activity',  label:'Activity', min:'staff', fn: viewActivity},
  {id:'reports',   label:'Reports', min:'staff', fn: viewReports},
  {id:'admin',     label:'Users', min:'admin', fn: viewAdmin}
];

function renderShell(){
  const tabs = TABS.filter(t => has(t.min));
  if (!tabs.find(t => t.id === currentTab)) currentTab = tabs[0].id;
  $('#app').innerHTML =
    '<div class="rail"><h1>The Pantry</h1><div class="who"><span>' + esc(me.full_name || me.email || '') + '</span><span class="pill off">' + esc(me.role) + '</span><button class="btn ghost sm" id="outBtn" style="color:#EFEDE4;border-color:#7d8f82">Sign out</button></div></div>' +
    '<div class="tabs" id="tabs">' + tabs.map(t => '<div class="tab' + (t.id === currentTab ? ' active' : '') + '" data-t="' + t.id + '">' + esc(t.label) + '</div>').join('') + '</div>' +
    '<main id="view"></main>';
  $('#outBtn').onclick = () => sb.auth.signOut();
  $('#tabs').onclick = e => { const t = e.target.closest('.tab'); if (!t) return; currentTab = t.dataset.t; renderShell(); };
  const tab = tabs.find(t => t.id === currentTab);
  Promise.resolve(tab.fn()).catch(e => { $('#view').innerHTML = '<div class="note bad">' + esc(errText(e)) + '</div>'; });
  mountBot();
}

function status(it){
  if (!it.is_active) return '<span class="pill off">inactive</span>';
  if (Number(it.quantity_on_hand) < 0) return '<span class="pill neg">negative</span>';
  if (it.par_level != null && Number(it.quantity_on_hand) <= Number(it.par_level)) return '<span class="pill low">low</span>';
  return '<span class="pill ok">ok</span>';
}
function table(heads, rows, empty){
  if (!rows.length) return '<p class="muted" style="margin:6px 0">' + esc(empty || 'Nothing here.') + '</p>';
  return '<table><thead><tr>' + heads.map(h => '<th' + (h.n ? ' class="tn"' : '') + '>' + esc(h.t || h) + '</th>').join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';
}

/* ------------------------------------------------------------------ dashboard */
async function viewDashboard(){
  const v = $('#view'); v.innerHTML = '<div class="note">Loading...</div>';
  const [low, reorder, neg, unm] = await Promise.all([
    q(sb.from('v_low_stock').select('*').order('item_name')),
    q(sb.from('v_reorder_suggestions').select('*').order('item_name')),
    q(sb.from('v_negative_stock').select('*').order('item_name')),
    q(sb.from('v_unmatched_items').select('*').order('supplier_sku_code'))
  ]);
  let drift = null;
  if (has('manager')) { try { drift = await q(sb.rpc('reconcile_stock')); } catch (e) { drift = null; } }
  const total = reorder.reduce((s, r) => s + (Number(r.est_cost) || 0), 0);
  const nonzero = items.filter(i => i.is_active && Number(i.quantity_on_hand) !== 0).length;
  v.innerHTML =
    (nonzero === 0 ? '<div class="note warn">Every item is at 0. Stock only becomes real after an opening count: go to <b>Log</b> and do a count first. Alerts also stay quiet until par levels are set (Inventory tab).</div>' : '') +
    '<div class="grid">' +
      '<div class="tile ' + (low.length ? 'warn' : '') + '"><div class="n">' + low.length + '</div><div class="l">Low stock items</div></div>' +
      '<div class="tile ' + (neg.length ? 'bad' : '') + '"><div class="n">' + neg.length + '</div><div class="l">Negative stock</div></div>' +
      '<div class="tile ' + (unm.length ? 'warn' : '') + '"><div class="n">' + unm.length + '</div><div class="l">Unmatched SKUs</div></div>' +
      (drift == null ? '' : '<div class="tile ' + (drift.length ? 'bad' : '') + '"><div class="n">' + (drift.length ? drift.length : 'OK') + '</div><div class="l">Ledger drift</div></div>') +
    '</div>' +
    '<div class="card"><h2>Reorder suggestions</h2><p class="sub">Items at or under par, rounded up to whole packs of the cheapest matched SKU. Estimated total ' + money(total) + '.</p>' +
      table([ 'Item', {t:'On hand', n:1}, {t:'Par', n:1}, 'SKU', 'Pack', {t:'Packs to order', n:1}, {t:'Est. cost', n:1} ],
        reorder.map(r => '<tr><td>' + esc(r.item_name) + '</td><td class="tn">' + fmt(r.quantity_on_hand) + ' ' + esc(r.unit_of_measure) + '</td><td class="tn">' + fmt(r.par_level) + '</td><td class="mono">' + esc(r.supplier_sku_code || 'no matched SKU') + '</td><td>' + esc(r.pack_description || '') + '</td><td class="tn">' + (r.packs_to_order == null ? '—' : r.packs_to_order) + '</td><td class="tn">' + money(r.est_cost) + '</td></tr>'),
        'Nothing to reorder.') + '</div>' +
    (neg.length ? '<div class="card"><h2>Negative stock</h2><p class="sub">Recipes, deliveries and counts disagree for these. A count will fix the number; look into why it drifted.</p>' +

/* ------------------------------------------------------------------ CSV parsing */
function parseCSV(text){
  text = String(text || '').replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  const cands = [',', '\t', ';'];
  let delim = ',', best = -1;
  cands.forEach(d => { const c = first.split(d).length; if (c > best) { best = c; delim = d; } });
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === delim) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== '')).map(r => r.map(c => String(c).trim()));
}
function guessCol(headers, patterns){
  for (const p of patterns) { const i = headers.findIndex(h => p.test(h)); if (i >= 0) return i; }
  return -1;
}

function wireImport(p, label, cols, previewFn){
  const state = {name: '', rows: null};
  if (p === 's') salesState = state; else delState = state;
  $('#' + p + 'File').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    state.name = f.name; const rd = new FileReader();
    rd.onload = () => { $('#' + p + 'Text').value = String(rd.result); previewFn(state); };
    rd.readAsText(f);
  };
  $('#' + p + 'Prev').onclick = () => { if (!state.name) state.name = ''; previewFn(state); };
}
function colSelect(id, headers, sel, label, optional){

}

  const headers = rows[0];
  const ci = guessCol(headers, [/^(menu )?item( name)?$/i, /menu item/i, /^name$/i, /item/i]);
  const cq = guessCol(headers, [/qty sold/i, /item qty/i, /^qty$/i, /quantity/i, /count/i, /sold/i]);
  $('#sOut').innerHTML =
    '<div class="row2" style="margin-top:12px">' + colSelect('sCi', headers, ci, 'Item name column') + colSelect('sCq', headers, cq, 'Quantity sold column') +
    '<div class="field"><label>Import name (must be unique)</label><input id="sName" value="' + esc(state.name ? state.name.replace(/\.[^.]+$/, '') + '-' + stamp() : 'toast-' + stamp()) + '"></div></div><div id="sRes"></div>';
  const redraw = () => {
    const iI = Number($('#sCi').value), iQ = Number($('#sCq').value), agg = {};
    rows.slice(1).forEach(r => { const name = (r[iI] || '').trim(), qty = num(r[iQ]); if (name && qty != null && qty > 0) agg[name] = (agg[name] || 0) + qty; });

  ['dCs', 'dCq', 'dCc'].forEach(id => $('#' + id).onchange = redraw);

function toks(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean).map(t => ABBR[t] || t); }
function lev(a, b){
  const d = []; for (let i = 0; i <= a.length; i++) d[i] = [i];
  for (let j = 0; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function tokScore(q, t){
  if (q === t) return 1;
  if ((q.endsWith('s') && q.slice(0, -1) === t) || (t.endsWith('s') && t.slice(0, -1) === q) || (q.endsWith('es') && q.slice(0, -2) === t)) return .95;
  if (q.length >= 3 && t.startsWith(q)) return .85;
  if (q.length >= 4 && t.length >= 4 && lev(q, t) <= (q.length >= 7 ? 2 : 1)) return .8;
  if (t.length >= 4 && q.startsWith(t)) return .75;
  return 0;
}
function scoreName(qt, name){
  const nt = toks(name); if (!qt.length || !nt.length) return 0;
  let sum = 0; const used = new Set();
  qt.forEach(q => { let best = 0, bi = -1; nt.forEach((t, i) => { const s = tokScore(q, t); if (s > best) { best = s; bi = i; } }); sum += best; if (bi >= 0 && best > 0) used.add(bi); });
  return (sum / qt.length) * .85 + (used.size / nt.length) * .15;
}
// Words left in the question after removing filler and intent words.
function itemWords(text){ return toks(text).filter(t => t.length > 1 && !STOP.has(t) && !INTENT_WORDS.has(t) && !/^\d+(\.\d+)?$/.test(t)); }
// Best-matching inventory items. Returns every item tied (within .06) with the best score.
function findItems(text, pool){
  const qt = itemWords(text); if (!qt.length) return [];
  const scored = (pool || items).map(i => ({i, s: scoreName(qt, i.item_name)})).filter(x => x.s >= .6).sort((a, b) => b.s - a.s);
  if (!scored.length) return [];
  return scored.filter(x => x.s >= scored[0].s - .06).slice(0, 8).map(x => x.i);

function parseRange(t){
  const now = new Date(), y = now.getFullYear(), mo = now.getMonth();
  const today = new Date(y, mo, now.getDate());
  const add = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const monday = add(today, -((today.getDay() + 6) % 7));
  let m;
  if (/\byesterday\b/.test(t)) return {from: add(today, -1), to: today, label: 'yesterday'};
  if (/\btoday\b/.test(t)) return {from: today, to: add(today, 1), label: 'today'};
  if ((m = t.match(/\b(?:last|past)\s+(\d+)\s*days?\b/))) return {from: add(today, -(Number(m[1]) - 1)), to: add(today, 1), label: 'the last ' + m[1] + ' days'};
  if ((m = t.match(/\b(?:last|past)\s+(\d+)\s*weeks?\b/))) return {from: add(today, -(Number(m[1]) * 7 - 1)), to: add(today, 1), label: 'the last ' + m[1] + ' weeks'};
  if (/\blast week\b/.test(t)) return {from: add(monday, -7), to: monday, label: 'last week (Mon–Sun)'};
  if (/\bthis week\b/.test(t)) return {from: monday, to: add(today, 1), label: 'this week'};
  if (/\bpast week\b/.test(t)) return {from: add(today, -6), to: add(today, 1), label: 'the last 7 days'};
  if (/\blast month\b/.test(t)) return {from: new Date(y, mo - 1, 1), to: new Date(y, mo, 1), label: 'last month'};
  if (/\bthis month\b/.test(t)) return {from: new Date(y, mo, 1), to: add(today, 1), label: 'this month'};
  if (/\bpast month\b/.test(t)) return {from: add(today, -29), to: add(today, 1), label: 'the last 30 days'};
  return null;
}
function rangeOr(t, days){

// Transaction types are grouped by keyword so this works whatever exact names the database uses.
function txKind(t){

async function fetchTx(r, ids){
  let all = [];
  for (let page = 0; page < 20; page++) {
    let qy = sb.from('stock_transaction').select('item_id,quantity_change,transaction_type,transaction_at,source_file,notes')
      .gte('transaction_at', r.from.toISOString()).lt('transaction_at', r.to.toISOString()).order('transaction_id');
    if (ids && ids.length) qy = qy.in('item_id', ids);
    const rows = await q(qy.range(page * 1000, page * 1000 + 999));
    all = all.concat(rows); if (rows.length < 1000) break;
  }
  // A reversal row ('reversal:<name>') undoes an earlier import: count it under that import's type.
  const orig = Array.from(new Set(all.filter(t => t.transaction_type === 'reversal' && t.source_file).map(t => t.source_file.slice(9))));
  if (orig.length) {
    const kinds = {};
    for (let i = 0; i < orig.length; i += 100) {
      const rows = await q(sb.from('stock_transaction').select('source_file,transaction_type').in('source_file', orig.slice(i, i + 100)).neq('transaction_type', 'reversal').limit(1000));
      rows.forEach(r => kinds[r.source_file] = r.transaction_type);
    }
    all.forEach(t => { if (t.transaction_type === 'reversal' && t.source_file) t.kind = txKind(kinds[t.source_file.slice(9)]); });
  }
  all.forEach(t => { if (!t.kind) t.kind = txKind(t.transaction_type); });
  return all;
}

const PACK_UNITS = {

function parsePack(desc){
  const s = String(desc || '').toUpperCase();

  let m = s.match(/(\d+(?:\.\d+)?)\s*\/\s*#\s*10\b/);
  if (m) return {count: Number(m[1]), size: 1, uom: '#10', d: 'container', cw: false, text: m[0]};
  m = s.match(new RegExp('(\\d+)\\s*\\/\\s*(\\d+)\\s*\\/\\s*(\\d+(?:\\.\\d+)?)\\s*' + UOM_RE));
  if (m) m = [m[0], String(Number(m[1]) * Number(m[2])), m[3], m[4]];
  if (!m) m = s.match(new RegExp('(\\d+(?:\\.\\d+)?)\\s*[\\/X]\\s*(\\d+(?:\\.\\d+)?)\\s*' + UOM_RE));
  if (!m) { const m2 = s.match(new RegExp('(\\d+(?:\\.\\d+)?)\\s*' + UOM_RE)); if (m2) m = [m2[0], '1', m2[1], m2[2]]; }

  const uom = m[3].replace(/\s+/g, ''), u = PACK_UNITS[uom];

  cup:{d:'v', f:8}, cups:{d:'v', f:8}, tbs:{d:'v', f:0.5}, tbsp:{d:'v', f:0.5}, tsp:{d:'v', f:1/6}, l:{d:'v', f:33.814}, liter:{d:'v', f:33.814}, ml:{d:'v', f:0.033814},
  each:{d:'c', f:1}, ea:{d:'c', f:1}, ct:{d:'c', f:1}, piece:{d:'c', f:1}, pieces:{d:'c', f:1}, pc:{d:'c', f:1}, egg:{d:'c', f:1}, eggs:{d:'c', f:1}, dozen:{d:'c', f:12}, slice:{d:'c', f:1}, slices:{d:'c', f:1}, strip:{d:'c', f:1}, strips:{d:'c', f:1}, roll:{d:'c', f:1}, rolls:{d:'c', f:1},

function convertPack(desc, unitName){

  }
  if (p.d === 'container') {
    if (CONTAINERS.test(un) || /^(each|ea|ct)$/.test(un)) return {units: p.count, why: p.text + ' = ' + p.count + ' cans per case.', sure: true};
    return {units: null, why: p.text + ' is ' + p.count + ' #10 cans, but the item is counted in "' + un + '". Enter how many ' + un + ' are in a case.', sure: false};
  }
  if (iu && iu.d === 'case') return {units: 1, why: 'Item is counted by the case, so 1 per pack.', sure: true};
  if (iu && (iu.d === p.d || (un.match(/^(oz|ounce|ounces)$/) && p.d === 'v'))) {
    const f = (iu.d !== p.d) ? 1 : iu.f;  // "oz" item with a liquid pack: treat as fluid ounces
    const total = r2(p.count * p.size * p.f / f);
    const how = (p.count > 1 ? p.count + ' × ' + p.size + ' ' + p.uom : p.size + ' ' + p.uom) + ' = ' + total + ' ' + un;
    return {units: total, why: how + (iu.d !== p.d ? ' (assuming fluid ounces).' : '.'), sure: iu.d === p.d};
  }
  if (iu && iu.d === 'c' && (p.d === 'w' || p.d === 'v')) {
    const D = String(desc || '').toUpperCase().replace(p.text, ' ');
    const ct = D.match(/\b(\d+)\s*CT\b/);
    if (ct) return {units: p.count * Number(ct[1]), why: p.count + ' packs × ' + ct[1] + ' count = ' + (p.count * Number(ct[1])) + ' ' + un + '.', sure: true};
    const pw = D.match(/(?:^|[^\d.])(\d*\.?\d+)\s*(?:Z|OZ)\b/);
    if (pw && p.d === 'w' && Number(pw[1]) > 0) {
      const tot = p.count * p.size * p.f, n = r2(tot / Number(pw[1]));
      return {units: n, why: (p.count > 1 ? p.count + ' × ' + p.size + ' ' + p.uom : p.size + ' ' + p.uom) + ' = ' + r2(tot) + ' oz ÷ ' + Number(pw[1]) + ' oz per ' + un + ' = ' + n + '.', sure: true};
    }
    const sl = D.match(/\b(\d+)\s*(?:SLCD|SLC|SLICES?|SL)\b/);
    if (sl && /^slices?$/.test(un)) return {units: p.count * Number(sl[1]), why: p.count + ' packs × ' + sl[1] + ' slices = ' + (p.count * Number(sl[1])) + ' slices.', sure: true};
    const rg = D.match(/\b(\d+)\s*-\s*(\d+)\b/);
    if (rg && p.uom.indexOf('LB') === 0 && /^(strips?|slices?)$/.test(un)) {
      const per = (Number(rg[1]) + Number(rg[2])) / 2, lbs = p.count * p.size;
      return {units: Math.round(per * lbs), why: rg[0] + ' ' + un + ' per lb (avg ' + per + ') × ' + lbs + ' lb ≈ ' + Math.round(per * lbs) + '. Check against a real case.', sure: false};
    }
    if (p.count > 1) return {units: p.count, why: p.text + ': assuming each ' + un + ' is one of the ' + p.count + ' pieces, so ' + p.count + ' per case. Check this.', sure: false};
  }
  if (CONTAINERS.test(un) || ((un === 'each' || un === 'ea') && p.count > 1)) {
    return {units: p.count, why: p.text + ': assuming 1 ' + un + ' = one inner pack, so ' + p.count + ' per case. Check this.', sure: false};
  }
  return {units: null, why: p.text + ' is measured in ' + p.uom + ' but the item is counted in "' + un + '". Enter how many ' + un + ' are in one pack.', sure: false};
}
function skuText(r){ return [r.description, r.product_description, r.item_description, r.brand, r.pack_description].filter(Boolean).join(' '); }
// US Foods names products "Noun, details". The item's main word (its last word, e.g. "Sourdough" in
// "Annie's Bakery Sourdough") must appear, and the item must also touch the product noun.
const GENERIC_HEAD = /^(cheese|bread|ham|salad|mix|meat|drink|soda|juice|herb|herbs)$/;
function suggestItems(r){
  const desc = skuText(r).replace(/^\s*per\s+lb\s*:\s*/i, '').replace(/\([^)]*\)/g, ' ');
  const segs = desc.split(',');
  const head = toks(segs[0]);
  const second = segs.length > 1 && head.some(t => GENERIC_HEAD.test(t)) ? toks(segs[1]).filter(t => !/\d/.test(t)).slice(0, 1) : [];
  const all = toks(desc).filter(t => !/\d/.test(t));
  if (!all.length) return [];
  const sym = (a, b) => Math.max(tokScore(a, b), tokScore(b, a));
  const best = (t, list) => list.reduce((m, x) => Math.max(m, sym(t, x)), 0);
  return items.filter(i => i.is_active).map(i => {
    const nt = toks(String(i.item_name).replace(/\([^)]*\)/g, ' ')).filter(t => t.length > 1);
    if (!nt.length) return {i, s: 0};
    const hItem = best(nt[nt.length - 1], all), cov = nt.reduce((m, t) => m + best(t, all), 0) / nt.length;
    const hHead = nt.some(t => best(t, head) >= .85) ? .2 : 0, hSecond = nt.some(t => best(t, second) >= .85) ? .25 : 0;
    const ok = hItem >= .85 && (hHead || hSecond);
    return {i, s: ok ? hItem * .5 + cov * .3 + Math.max(hHead, hSecond) : 0};
  }).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 3).map(x => x.i);
}
function skuCard(r){
  const sug = suggestItems(r), pick = r.item_id ? itemById[r.item_id] : sug[0];
  const conv = pick ? convertPack(skuText(r), pick.unit_of_measure) : {units: null, why: 'No item name in the description to match on. Pick the item below.', sure: false};
  const units = r.item_id && r.units_per_pack != null ? r.units_per_pack : conv.units;
  const sugIds = new Set(sug.map(i => i.item_id));
  const opt = i => '<option value="' + i.item_id + '"' + (pick && pick.item_id === i.item_id ? ' selected' : '') + '>' + esc(i.item_name) + ' (' + esc(i.unit_of_measure) + ')</option>';
  return '<div class="bot-card" data-sku="' + esc(r.supplier_sku_code) + '">' +
    '<div><b class="mono">' + esc(r.supplier_sku_code) + '</b> <span class="muted">' + esc(r.pack_description || '') + '</span>' + (r.last_unit_cost != null ? ' <span class="muted">· ' + money(r.last_unit_cost) + '</span>' : '') + '</div>' +
    '<div class="field"><label>Item</label><select data-f="item"><option value="">(choose item)</option>' +
      (sug.length ? '<optgroup label="Suggested">' + sug.map(opt).join('') + '</optgroup><optgroup label="All items">' : '') +
      items.filter(i => !sugIds.has(i.item_id)).map(opt).join('') + (sug.length ? '</optgroup>' : '') + '</select></div>' +
    '<div class="field"><label>Item units per pack</label><input data-f="units" type="number" step="0.01" min="0" value="' + (units == null ? '' : units) + '"></div>' +
    '<div class="bot-why' + (conv.sure ? '' : ' check') + '">' + esc(conv.why) + '</div>' +
    '<div class="toolbar" style="margin:8px 0 0"><button class="btn sm" data-apply="1">Apply match</button></div></div>';
}

async function ansStock(text, found){
  await loadRefs();
  const list = (found || findItems(text)).map(i => itemById[i.item_id] || i);

async function ansLow(){
  await loadRefs();
  const low = items.filter(i => i.is_active && i.par_level != null && Number(i.quantity_on_hand) <= Number(i.par_level))

}

async function ansUsage(text, found){
  const r = rangeOr(text, 7), list = found || findItems(text);
  if (!list.length && /\b(sold|sales?|sell)\b/.test(text)) {
    const menuHit = findItems(text, menuRecipes.map(m => ({item_id: 'r' + m.recipe_id, item_name: m.recipe_name + ' ' + (m.toast_menu_item || '')})));
    if (menuHit.length) return P('Menu-item sales counts aren\'t stored: sales imports only record the ingredients they used. I can show ingredient usage instead.') + chips(['Top usage ' + (parseRange(text) ? parseRange(text).label : 'last 7 days').replace(/ \(Mon–Sun\)/, '')]);
  }
  const tx = await fetchTx(r, list.map(i => i.item_id));
  if (list.length) {
    BOT.lastItems = list;
    const rows = list.map(i => {
      const a = {sale: 0, prep: 0, waste: 0, made: 0, recv: 0};
      tx.filter(t => t.item_id === i.item_id).forEach(t => { const k = t.kind, c = Number(t.quantity_change) || 0;
        if (k === 'sale') a.sale -= c; else if (k === 'waste') a.waste -= c; else if (k === 'prep') { if (c < 0) a.prep -= c; else a.made += c; } else if (k === 'delivery') a.recv += c; });
      return {i, a, used: a.sale + a.prep + a.waste};
    });
    return P('Usage for ' + esc(r.label) + ':') +
      table(['Item', {t:'Sales', n:1}, {t:'Prep', n:1}, {t:'Waste', n:1}, {t:'Total used', n:1}, {t:'Received', n:1}],
        rows.map(x => '<tr><td>' + esc(x.i.item_name) + '</td><td class="tn">' + fmt(x.a.sale) + '</td><td class="tn">' + fmt(x.a.prep) + '</td><td class="tn">' + fmt(x.a.waste) + '</td><td class="tn"><b>' + fmt(x.used) + ' ' + esc(x.i.unit_of_measure) + '</b></td><td class="tn">' + fmt(x.a.recv) + '</td></tr>')) +
      (rows.some(x => x.a.made) ? P('<span class="muted">Made in prep batches: ' + rows.filter(x => x.a.made).map(x => esc(x.i.item_name) + ' ' + fmt(x.a.made)).join(', ') + '.</span>') : '');
  }
  const agg = {};
  tx.forEach(t => { const k = t.kind, c = Number(t.quantity_change) || 0; if (k === 'sale' || (k === 'prep' && c < 0)) agg[t.item_id] = (agg[t.item_id] || 0) - c; });
  const top = Object.keys(agg).map(id => ({id: Number(id), q: agg[id]})).filter(x => x.q > 0).sort((a, b) => b.q - a.q).slice(0, 15);
  if (!top.length) return P('No sales or prep usage recorded for ' + esc(r.label) + '.');
  return P('Most-used ingredients (sales + prep), ' + esc(r.label) + ':') +
    table(['Item', {t:'Used', n:1}], top.map(x => '<tr><td>' + nameOf(x.id) + '</td><td class="tn">' + fmt(x.q) + ' ' + unitOf(x.id) + '</td></tr>'));
}

  rows = rows.filter(x => inRange(x.transaction_at, r));

  const what = list.length ? list.map(i => esc(i.item_name)).join(', ') : 'anything';
  if (!rows.length) return P('No waste logged for ' + what + ' in ' + esc(r.label) + '.');
  const total = rows.reduce((s, x) => s + (Number(x.est_cost) || 0), 0);
  const by = {}; rows.forEach(x => { const b = by[x.item_name] || (by[x.item_name] = {n: x.item_name, q: 0, c: 0, u: x.unit_of_measure, times: 0}); b.q += Number(x.quantity_wasted) || 0; b.c += Number(x.est_cost) || 0; b.times++; });
  const reasons = {}; rows.forEach(x => { const k = String(x.reason || 'Other').split(':')[0]; reasons[k] = (reasons[k] || 0) + (Number(x.est_cost) || 0); });
  const topR = Object.keys(reasons).sort((a, b) => reasons[b] - reasons[a]).slice(0, 3);
  return P('Waste in ' + esc(r.label) + ': <b>' + rows.length + '</b> entries, about <b>' + money(total) + '</b>.') +
    table(['Item', {t:'Wasted', n:1}, {t:'Times', n:1}, {t:'Est. cost', n:1}], Object.values(by).sort((a, b) => b.c - a.c || b.q - a.q).slice(0, 15).map(b => '<tr><td>' + esc(b.n) + '</td><td class="tn">' + fmt(b.q) + ' ' + esc(b.u || '') + '</td><td class="tn">' + b.times + '</td><td class="tn">' + money(b.c) + '</td></tr>')) +

}

async function ansSku(text){
  await loadSkus();
  const raw = String(text).toLowerCase();
  const code = raw.split(/[^a-z0-9-]+/).find(w => w && skuRows.some(s => s.supplier_sku_code.toLowerCase() === w));
  if (code) {
    const r = skuRows.find(s => s.supplier_sku_code.toLowerCase() === code);
    return P(r.item_id ? 'This SKU is matched to <b>' + nameOf(r.item_id) + '</b> at ' + fmt(r.units_per_pack) + ' ' + unitOf(r.item_id) + ' per pack. You can change it here:' : 'This SKU is not matched yet. My suggestion:') + skuCard(r);
  }
  if (/\b(check|audit|verify|wrong|conversions?)\b/.test(raw)) {
    const bad = skuRows.filter(r => r.item_id && itemById[r.item_id]).map(r => ({r, c: convertPack(skuText(r), itemById[r.item_id].unit_of_measure)}))
      .filter(x => x.c.units != null && x.c.sure && Math.abs(Number(x.r.units_per_pack) - x.c.units) > Math.max(.01, x.c.units * .02));
    if (!bad.length) return P('I checked every matched SKU whose pack size I can read. None disagree with the saved conversion.');
    return P(bad.length + ' matched SKU(s) have a conversion that doesn\'t match their pack size. Review each one:') + bad.slice(0, 5).map(x => skuCard(x.r)).join('') +
      (bad.length > 5 ? P('<span class="muted">and ' + (bad.length - 5) + ' more.</span>') : '');
  }
  const un = skuRows.filter(r => !r.item_id);
  if (/\b(more|next)\b/.test(raw) && BOT.prev === 'sku') BOT.skuOffset += 5; else BOT.skuOffset = 0;
  if (!un.length) return P('Every SKU is matched.') + chips(['Check SKU conversions']);
  if (BOT.skuOffset >= un.length) BOT.skuOffset = 0;
  const page = un.slice(BOT.skuOffset, BOT.skuOffset + 5);
  return P(un.length + ' unmatched SKU(s); they move no stock until matched. Showing ' + (BOT.skuOffset + 1) + '–' + (BOT.skuOffset + page.length) + '. Check each suggestion, then click Apply.') +
    page.map(skuCard).join('') + (BOT.skuOffset + 5 < un.length ? chips(['More unmatched SKUs']) : '');
}

async function answer(text){
  const t = String(text).toLowerCase().trim();
  if (!t) return null;
  BOT.prev = BOT.last;
  if (/^(help|\?|hi|hello|hey|what can you do|commands)\b/.test(t)) return ansHelp();
  if (/\bskus?\b|unmatched|mapping|\bmap\b|\bmatch(ed|ing)?\b/.test(t) || (BOT.last === 'sku' && /^(more|next)\b/.test(t))) return (BOT.last = 'sku', ansSku(t));
  if (/\b(re)?order\b|\bbuy\b|purchase|shopping/.test(t)) return (BOT.last = 'reorder', ansReorder());
  if (/negative|below zero/.test(t)) return (BOT.last = 'negative', ansNegative());
  if (/\blow\b|running out|\bshort\b|below par|under par|\bneed\b/.test(t) && !itemWords(t).length) return (BOT.last = 'low', ansLow());
  if (/wast|threw|thrown|toss|spoil|trash/.test(t)) return (BOT.last = 'waste', ansWaste(t));
  if (/shrink|variance|missing|theft|discrepan/.test(t)) return (BOT.last = 'shrink', ansShrink(t));
  if (/deliver|receiv|came in|shipment|invoice/.test(t)) return (BOT.last = 'delivery', ansDelivery(t));
  if (/\bused?\b|usage|went through|go through|consum|\bsold\b|\bsales?\b|\bsell\b/.test(t)) return (BOT.last = 'usage', ansUsage(t));
  if (/how much|how many|on hand|in stock|\bstock\b|\bleft\b|\bhave\b|inventory|\blow\b/.test(t)) return (BOT.last = 'stock', ansStock(t));
  const found = findItems(t);
  if (found.length) {
    // Follow-up like "what about cheddar" keeps the previous question type.
    const fn = {usage: ansUsage, waste: ansWaste, shrink: ansShrink, delivery: ansDelivery}[BOT.last];
    if (fn && (parseRange(t) || /^(and|what about|how about)\b/.test(t))) return fn(t, found);
    return (BOT.last = 'stock', ansStock(t, found));
  }
  if (parseRange(t) && BOT.lastItems && {usage:1, waste:1, shrink:1, delivery:1}[BOT.last])
    return {usage: ansUsage, waste: ansWaste, shrink: ansShrink, delivery: ansDelivery}[BOT.last](t, BOT.lastItems);
  return P('Sorry, I didn\'t understand that.') + ansHelp();
}

/* ---------- widget ---------- */
const BOT_ICON = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
function unmountBot(){ const el = $('#bot'); if (el) el.remove(); BOT.last = null; BOT.lastItems = null; BOT.skuOffset = 0; }
function mountBot(){
  if (!has('manager')) return unmountBot();
  if ($('#bot')) return;
  const root = document.createElement('div'); root.id = 'bot';
  root.innerHTML =
    '<button class="bot-fab" id="botFab" aria-label="Open Pantry assistant" title="Pantry assistant">' + BOT_ICON + '</button>' +
    '<div class="bot-panel hidden" id="botPanel" role="dialog" aria-label="Pantry assistant">' +
      '<div class="bot-head"><b>Pantry assistant</b><button id="botClose" aria-label="Close">&times;</button></div>' +
      '<div class="bot-log" id="botLog" aria-live="polite"></div>' +
      '<div class="bot-quick">' + chips(['What\'s low?', 'What should I order?', 'Waste this week', 'Top usage last week', 'Shrinkage this month', 'Unmatched SKUs', 'Check SKU conversions']) + '</div>' +
      '<div class="bot-in"><input id="botInput" placeholder="Ask about stock, waste, SKUs..." autocomplete="off"><button class="btn" id="botSend">Ask</button></div>' +
    '</div>';
  document.body.appendChild(root);
  const panel = $('#botPanel'), log = $('#botLog'), input = $('#botInput');
  const add = (html, who) => { const d = document.createElement('div'); d.className = 'bot-msg ' + who; d.innerHTML = html; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; };
  const send = async txt => {
    txt = String(txt || '').trim(); if (!txt || BOT.busy) return;
    BOT.busy = true; add(esc(txt), 'me'); input.value = '';
    const wait = add('<span class="muted">Looking that up...</span>', 'it');
    try { wait.innerHTML = (await answer(txt)) || ''; }
    catch (e) { wait.innerHTML = '<div class="note bad" style="margin:0">' + esc(errText(e)) + '</div>'; }
    BOT.busy = false; log.scrollTop = log.scrollHeight; input.focus();
  };
  $('#botFab').onclick = () => { panel.classList.toggle('hidden'); if (!panel.classList.contains('hidden')) { if (!log.children.length) add(P('Hi ' + esc((me.full_name || '').split(' ')[0] || 'there') + '. Ask me about stock, usage, waste, deliveries or SKU matching.') + chips(['Help']), 'it'); input.focus(); } };
  $('#botClose').onclick = () => panel.classList.add('hidden');
  $('#botSend').onclick = () => send(input.value);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(input.value); });
  panel.addEventListener('click', async e => {
    const chip = e.target.closest('[data-ask]'); if (chip) return send(chip.dataset.ask);
    const ap = e.target.closest('[data-apply]'); if (!ap) return;
    const card = ap.closest('.bot-card'), code = card.dataset.sku;
    const item = Number(card.querySelector('[data-f="item"]').value), units = num(card.querySelector('[data-f="units"]').value);
    if (!item || !units || units <= 0) return toast('Choose an item and enter a conversion above zero.', true);
    const row = skuRows.find(s => s.supplier_sku_code === code) || {};
    if (!confirm('Match ' + code + ' to ' + itemById[item].item_name + ' at ' + units + ' ' + itemById[item].unit_of_measure + ' per pack?')) return;
    ap.disabled = true;
    try {
      await q(sb.rpc('confirm_sku', {p_sku_code: code, p_item_id: item, p_units_per_pack: units, p_last_unit_cost: row.last_unit_cost == null ? null : Number(row.last_unit_cost)}));
      await loadSkus();
      card.innerHTML = '<span class="pill ok">matched</span> <b class="mono">' + esc(code) + '</b> → ' + esc(itemById[item].item_name) + ', ' + fmt(units) + ' ' + esc(itemById[item].unit_of_measure) + ' per pack.' +
        '<div class="bot-why">Earlier deliveries of this SKU added no stock. Re-import them under a new name if needed.</div>';
      toast('Matched ' + code + '.');
      if (currentTab === 'skus' || currentTab === 'dashboard') renderShell();
    } catch (err) { toast(errText(err), true); ap.disabled = false; }
  });
  panel.addEventListener('change', e => {
    const sel = e.target.closest('[data-f="item"]'); if (!sel) return;
    const card = sel.closest('.bot-card'), row = skuRows.find(s => s.supplier_sku_code === card.dataset.sku), it = itemById[Number(sel.value)];
    const why = card.querySelector('.bot-why'), inp = card.querySelector('[data-f="units"]');
    if (!it || !row) { why.textContent = 'Pick an item.'; return; }
    const c = convertPack(skuText(row), it.unit_of_measure);
    inp.value = c.units == null ? '' : c.units; why.textContent = c.why; why.className = 'bot-why' + (c.sure ? '' : ' check');
  });
}

boot();
})();
</script>
